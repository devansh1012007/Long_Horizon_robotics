# RecoverGraph console — reverse proxy.
# Routes same-origin socket.io websockets to the engine and everything
# else to the Next.js dashboard. The dashboard's server-side calls use
# ENGINE_URL=http://engine:3031 directly (never exposed publicly).

upstream rg_dashboard {
    server dashboard:3000;
}

upstream rg_engine {
    server engine:3031;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    # socket.io telemetry (websocket upgrade + long-lived polling)
    location /socket.io/ {
        proxy_pass http://rg_engine;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # engine HTTP API is proxied by the Next.js gateway, not exposed here
    location / {
        proxy_pass http://rg_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }
}
