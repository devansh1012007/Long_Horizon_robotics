name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check rg_core rgsim systems experiments --quiet || true
      - name: Unit + integration tests
        run: pytest -q
      - name: ROS scaffold structural check (no ROS needed)
        run: python scripts/check_ros_scaffold.py
      - name: 20-episode smoke simulation
        run: |
          python -m experiments.run_episodes --systems B2 RG --horizons 2 \
            --conditions single none --episodes 10 --out /tmp/smoke
          python -m experiments.analysis --results /tmp/smoke

  ros:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            python3-pip ros-jazzy-rosidl-default-generators
          pip3 install --break-system-packages .
      - name: colcon build
        run: |
          . /opt/ros/jazzy/setup.sh
          cd ros2_ws
          colcon build --symlink-install
