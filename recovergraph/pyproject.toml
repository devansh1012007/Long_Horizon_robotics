[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recovergraph"
version = "0.1.0"
description = "RecoverGraph: causal, uncertainty-aware recovery for long-horizon robot manipulation (v0.1)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.1",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[tool.setuptools]
packages = ["rg_core", "rgsim", "systems"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
