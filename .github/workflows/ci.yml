name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    name: Engine + research core (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r engine/requirements.txt mujoco
      - name: Engine service tests
        run: python3 -m pytest engine/tests -q
      - name: RecoverGraph core tests
        run: python3 -m pytest recovergraph/tests -q

  web:
    name: Dashboard (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prisma generate
        run: bunx prisma generate
      - name: Build
        run: bun run build
