# RecoverGraph production stack: dashboard + engine + reverse proxy.
#   docker compose up -d --build     (from the repo root)
# Then open http://localhost/ and register an operator account.
#
# Scale notes (docs/PRODUCTION.md):
#   - engine:      `docker compose up -d --scale engine=N` needs sticky
#                  sessions for socket.io rooms (job_id hash) — see docs.
#   - dashboard:   stateless; scale freely behind the proxy.
#   - data:        single shared volume (SQLite); move to Postgres for
#                  multi-writer clusters.

services:
  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    restart: unless-stopped
    environment:
      ENGINE_HOST: 0.0.0.0
      ENGINE_PORT: "3031"
      ENGINE_WORKERS: "3"
      ENGINE_MAX_QUEUE: "48"
    volumes:
      - rg-data:/app/data
    networks:
      - internal
    # Engine is intentionally NOT published: the nginx proxy is the only
    # entry point. For a sidecar-style local dev instead:
    # ports: ["127.0.0.1:3031:3031"]

  dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile.dashboard
      args:
        NEXT_PUBLIC_SOCKET_URL: "/"
        NEXT_PUBLIC_SOCKET_PATH: "/socket.io/"
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/dashboard.db
      ENGINE_URL: http://engine:3031
      COOKIE_SECURE: "0"          # set to 1 when serving over HTTPS
      MAX_ACTIVE_JOBS_PER_USER: "2"
    volumes:
      - rg-data:/app/data
    depends_on:
      - engine
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dashboard
      - engine
    networks:
      - internal

volumes:
  rg-data:

networks:
  internal:
